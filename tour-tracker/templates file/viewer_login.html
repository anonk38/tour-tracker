<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#121212">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <!-- আইফোনে হোম স্ক্রিনে অ্যাপের ইংরেজি নাম -->
    <meta name="apple-mobile-web-app-title" content="Tour Tracker">
    <!-- মানিব্যাগ আইকন -->
    <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/1086/1086741.png">
    
    <title>লগইন | Tour Tracker</title>
    <style>
        body { background: #121212; color: #e0e0e0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .login-card { background: #1e1e1e; padding: 30px; border-radius: 12px; border: 1px solid #333; width: 90%; max-width: 350px; text-align: center; box-shadow: 0 4px 15px rgba(0,0,0,0.5); }
        input { width: 100%; padding: 12px; margin-top: 15px; border-radius: 6px; border: 1px solid #444; background: #2a2a2a; color: #fff; box-sizing: border-box; font-size: 16px; text-align: center; letter-spacing: 2px; }
        button { width: 100%; padding: 12px; margin-top: 15px; border-radius: 6px; border: none; background: #007bff; color: white; font-weight: bold; font-size: 15px; cursor: pointer; }
        .error { color: #dc3545; margin-top: 12px; font-size: 14px; background: #2c0b0e; padding: 8px; border-radius: 4px; border: 1px solid #dc3545; }
    </style>
</head>
<body>
    <div class="login-card">
        <img src="https://cdn-icons-png.flaticon.com/512/1086/1086741.png" width="60" style="margin-bottom: 10px;">
        <h2 style="margin: 0;">Tour Tracker</h2>
        <p style="color: #888; font-size: 13px; margin-top: 5px; margin-bottom: 20px;">অ্যাক্সেস পেতে পিন দিন / Enter PIN</p>
        
        <form action="/viewer_login" method="POST">
            <input type="password" name="pin" placeholder="••••" required autofocus>
            {% if error %}
                <div class="error">{{ error }}</div>
            {% endif %}
            <button type="submit">লগইন / Login</button>
        </form>
    </div>
</body>
</html>
